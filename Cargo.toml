[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
wb-proto = { path = "crates/wb-proto" }

agent-client-protocol-schema = { version = "=1.11.0", default-features = false }
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false }
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
rustix = "1.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = "1.53.2"
tokio-tungstenite = "0.29"
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", default-features = false }
vt100 = "0.16.2"

[profile.release]
panic = "unwind"
lto = "thin"
