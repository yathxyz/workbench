[package]
name = "wb-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
wb-proto.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["ws", "http1", "json", "query", "tokio"] }
futures-util.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["rustls", "json", "stream"] }
rustix = { workspace = true, features = ["fs", "param", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "time", "fs", "sync"] }
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true
